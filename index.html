<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00eaff">
<link rel="icon" href="icon.png">
<style>
:root{--panel:rgba(4,15,24,.92);--cyan:#00eaff;--blue:#087cff;--green:#00ff9d;--text:#e6fbff;--muted:#718894}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 35%,#062233 0%,#020509 48%,#000 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,234,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,234,255,.025) 1px,transparent 1px);background-size:45px 45px}
.app{width:min(1500px,100%);margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:15px;border-bottom:1px solid rgba(0,234,255,.3)}
.logo{color:var(--cyan);font-size:28px;font-weight:bold;letter-spacing:5px;text-shadow:0 0 10px var(--cyan),0 0 30px rgba(0,234,255,.5)}
.subtitle{color:var(--muted);font-size:9px;letter-spacing:2px;margin-top:4px}
.clock{text-align:right;color:var(--cyan)}
#time{font-size:22px;font-weight:bold}
#date{color:var(--muted);font-size:11px}
.dashboard{display:grid;grid-template-columns:230px minmax(300px,1fr) 430px;gap:18px;margin-top:18px}
.panel{background:var(--panel);border:1px solid rgba(0,234,255,.22);box-shadow:0 0 30px rgba(0,160,255,.05),inset 0 0 25px rgba(0,234,255,.02);padding:16px}
.panel h2{color:var(--cyan);font-size:12px;letter-spacing:2px;margin:0 0 15px}
.status{display:flex;align-items:center;gap:8px;color:var(--green);margin-bottom:10px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 15px var(--green)}
.status-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px}
.status-row strong{color:var(--cyan)}
button{color:var(--cyan);background:rgba(0,234,255,.04);border:1px solid rgba(0,234,255,.3);padding:9px;cursor:pointer;transition:.2s;font-family:inherit;font-size:11px}
button:hover{background:rgba(0,234,255,.12);box-shadow:0 0 15px rgba(0,234,255,.2)}
button:disabled{opacity:.35;cursor:not-allowed}
.control{width:100%;margin-bottom:7px}
.center{min-height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.reactor{width:min(410px,70vw);aspect-ratio:1;position:relative;display:grid;place-items:center}
.ring{position:absolute;border-radius:50%;border:1px solid var(--cyan);box-shadow:0 0 20px rgba(0,234,255,.35),inset 0 0 20px rgba(0,234,255,.08)}
.ring1{inset:5%;border-style:dashed;animation:rot 12s linear infinite}
.ring2{inset:16%;animation:rev 8s linear infinite}
.ring3{inset:28%;border-color:var(--blue);animation:pul 2s ease-in-out infinite}
.ring4{inset:38%;border-color:rgba(0,234,255,.4)}
.core{width:30%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#087d9c,#03121a 65%,#010305);border:2px solid var(--cyan);display:grid;place-items:center;align-content:center;box-shadow:0 0 30px var(--cyan),inset 0 0 30px rgba(0,234,255,.6)}
.core-name{font-size:18px;font-weight:bold;letter-spacing:3px}
#coreStatus{color:var(--cyan);font-size:8px;letter-spacing:2px;margin-top:5px}
.voice-status{display:flex;align-items:center;gap:8px;margin-top:15px;color:var(--muted);font-size:10px;letter-spacing:2px}
#voiceDot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.chat{height:600px;display:flex;flex-direction:column}
.chat-header{display:flex;justify-content:space-between;align-items:start;gap:6px}
.messages{flex:1;overflow-y:auto;padding:10px 0}
.message{margin-bottom:15px}
.name{color:var(--cyan);font-size:9px;letter-spacing:2px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
.user .name{color:#8095ff}
.bubble{border-left:2px solid var(--cyan);background:rgba(0,234,255,.035);padding:10px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.user .bubble{border-left-color:#8095ff}
.copy{background:none;border:none;color:var(--muted);font-size:10px;padding:0 4px}
.copy:hover{color:var(--cyan);box-shadow:none;background:none}
.inputrow{display:flex;gap:6px}
input[type=text]{flex:1;min-width:0;background:#010508;border:1px solid rgba(0,234,255,.3);color:#fff;padding:12px;outline:none;font-family:inherit}
input[type=text]:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,234,255,.15)}
.send{padding:0 15px}
.mic{width:48px;font-size:18px}
.history{max-height:200px;overflow-y:auto;color:var(--muted);font-size:10px;line-height:1.7}
.settings{margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;align-items:end}
label{color:var(--muted);font-size:10px;display:flex;flex-direction:column;gap:6px}
select{background:#03090d;color:#fff;border:1px solid rgba(0,234,255,.3);padding:9px;font-family:inherit}
input[type=range]{accent-color:var(--cyan)}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes rev{to{transform:rotate(-360deg)}}
@keyframes pul{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.5}}
@keyframes think{to{transform:scale(1.12)}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.thinking .core{animation:think .7s ease-in-out infinite alternate}
.listening .core{box-shadow:0 0 70px var(--green),inset 0 0 35px var(--green)}
.speaking .core{box-shadow:0 0 70px #8095ff,inset 0 0 35px #8095ff}
.dots span{animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@media(max-width:1100px){.dashboard{grid-template-columns:200px 1fr}.chat{grid-column:1/-1}}
@media(max-width:700px){.app{padding:10px}.logo{font-size:20px}.dashboard{grid-template-columns:1fr}.chat{grid-column:auto;height:520px}.center{min-height:360px}.reactor{width:min(300px,80vw)}}
</style>
</head>
<body>
<div class="app">

<header>
<div><div class="logo">J.A.R.V.I.S.</div><div class="subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div></div>
<div class="clock"><div id="time">--:--:--</div><div id="date">Loading...</div></div>
</header>

<div class="dashboard">

<aside>
<div class="panel">
<h2>SYSTEM STATUS</h2>
<div class="status"><span class="status-dot"></span><strong id="status">ONLINE</strong></div>
<div class="status-row"><span>MODEL</span><strong id="modelTag">FLASH</strong></div>
<div class="status-row"><span>REQUESTS</span><strong id="reqCount">0</strong></div>
<div class="status-row"><span>MEMORY</span><strong id="memTag">0</strong></div>
</div>
<br>
<div class="panel">
<h2>VOICE CONTROL</h2>
<button class="control" id="voiceToggle">VOICE: ON</button>
<button class="control" id="muteButton">MUTE</button>
<button class="control" id="stopBtn">🛑 STOP SPEAKING</button>
<button class="control" id="micButton">🎙 START LISTENING</button>
<div id="micSupport" style="color:var(--muted);font-size:10px;line-height:1.5">Checking microphone...</div>
</div>
<br>
<div class="panel">
<h2>COMMAND HISTORY</h2>
<div id="history" class="history"><div>› JARVIS initialized</div></div>
</div>
</aside>

<section class="center">
<div class="reactor" id="reactor">
<div class="ring ring1"></div><div class="ring ring2"></div><div class="ring ring3"></div><div class="ring ring4"></div>
<div class="core"><div class="core-name">JARVIS</div><div id="coreStatus">ONLINE</div></div>
</div>
<div class="voice-status"><span id="voiceDot"></span><span id="voiceText">VOICE READY</span></div>
</section>

<section class="panel chat">
<div class="chat-header">
<div><h2>CONVERSATION</h2><div style="color:var(--muted);font-size:9px">SECURE AI CHANNEL</div></div>
<div style="display:flex;gap:5px"><button id="exportBtn">SAVE</button><button id="clearButton">CLEAR</button></div>
</div>
<div id="messages" class="messages"></div>
<div class="inputrow">
<button class="mic" id="chatMic">🎙</button>
<input type="text" id="messageInput" placeholder="Ask JARVIS anything...  (Ctrl+K)" autocomplete="off">
<button class="send" id="sendButton">SEND</button>
</div>
</section>

</div>

<section class="panel settings">
<h2>SETTINGS</h2>
<div class="grid">
<label>AI Model<select id="modelSelect">
<option value="gemini-flash-lite-latest">Flash Lite (max quota)</option>
<option value="gemini-flash-latest">Flash (balanced)</option>
<option value="gemini-2.5-pro">Pro (smartest)</option>
<option value="gemini-2.0-flash">2.0 Flash</option>
</select></label>
<label>Personality<select id="personality">
<option value="classic">Classic JARVIS</option>
<option value="concise">Concise</option>
<option value="friendly">Friendly</option>
<option value="expert">Expert / Detailed</option>
</select></label>
<label>Voice<select id="voiceSelect"><option>Loading...</option></select></label>
<label>Speech speed<input id="speechRate" type="range" min=".5" max="2" step=".1" value="1"></label>
<label>Theme<select id="theme">
<option value="cyan">Cyan</option><option value="blue">Blue</option>
<option value="purple">Purple</option><option value="gold">Gold</option><option value="red">Red</option>
</select></label>
<button id="saverBtn">🔋 SAVER: ON</button>
<button id="searchBtn">🔍 SEARCH: ON</button>
<button id="keyButton">🔑 API KEY</button>
<button id="resetButton">↺ RESET</button>
<button id="installBtn" style="display:none">📱 INSTALL</button>
</div>
</section>

</div>

<script>
/* ===== JARVIS ===== */
var KEY="jarvisKey",SET="jarvisSettings",CHAT="jarvisChat";
var apiKey=localStorage.getItem(KEY)||"";
var $=function(i){return document.getElementById(i)};

var S={model:"gemini-flash-latest",person:"classic",voiceName:"",rate:1,theme:"cyan",saver:true,search:true,voiceOn:true,muted:false};
try{var sv=JSON.parse(localStorage.getItem(SET));if(sv)for(var k in sv)S[k]=sv[k]}catch(e){}
function saveSet(){try{localStorage.setItem(SET,JSON.stringify(S))}catch(e){}}

var convo=[],msgCount=0,recog=null,listening=false,timers=[];

/* ---- personalities ---- */
var PERSON={
classic:"You are JARVIS, an exceptionally capable personal AI assistant. Speak with a calm, intelligent, polished British-style personality: precise, friendly, slightly formal, confident without being robotic. Address the user respectfully. Keep answers concise but complete. Never invent facts.",
concise:"You are JARVIS. Answer in as few words as possible while staying accurate and useful. Prefer short sentences and bullet points. No filler, no pleasantries. Never invent facts.",
friendly:"You are JARVIS, a warm and upbeat AI assistant. Be casual, encouraging and easy to understand, like a helpful friend. Use plain language and the occasional emoji. Never invent facts.",
expert:"You are JARVIS, a technical expert assistant. Give thorough, well-structured answers with reasoning, context and step-by-step detail where useful. Note uncertainty honestly. Never invent facts or sources."};

/* ---- clock ---- */
function clock(){var n=new Date();$("time").textContent=n.toLocaleTimeString();
$("date").textContent=n.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})}
setInterval(clock,1000);clock();

/* ---- status ---- */
function setStatus(v){$("status").textContent=v;$("coreStatus").textContent=v;$("voiceText").textContent=v;
var r=$("reactor");r.classList.remove("thinking","listening","speaking");var d=$("voiceDot");
if(v=="THINKING"){r.classList.add("thinking");d.style.background="#ffd43b"}
else if(v=="LISTENING"){r.classList.add("listening");d.style.background="#00ff9d"}
else if(v=="SPEAKING"){r.classList.add("speaking");d.style.background="#8095ff"}
else d.style.background="#00ff9d"}

/* ---- messages ---- */
function addMessage(who,text,skipSave){
var m=document.createElement("div");m.className="message"+(who=="You"?" user":"");
var n=document.createElement("div");n.className="name";
var s=document.createElement("span");s.textContent=who.toUpperCase();n.appendChild(s);
if(who!="You"){var c=document.createElement("button");c.className="copy";c.textContent="copy";
c.onclick=function(){navigator.clipboard.writeText(text);c.textContent="copied!";setTimeout(function(){c.textContent="copy"},1200)};n.appendChild(c)}
var b=document.createElement("div");b.className="bubble";b.textContent=text;
m.appendChild(n);m.appendChild(b);$("messages").appendChild(m);
$("messages").scrollTop=$("messages").scrollHeight;
if(!skipSave)saveChat()}

function addHistory(t){var i=document.createElement("div");i.textContent="› "+t;
$("history").appendChild(i);$("history").scrollTop=$("history").scrollHeight}

function typing(on){var t=$("typingBubble");
if(on&&!t){var m=document.createElement("div");m.className="message";m.id="typingBubble";
m.innerHTML='<div class="name"><span>JARVIS</span></div><div class="bubble dots"><span>●</span><span>●</span><span>●</span></div>';
$("messages").appendChild(m);$("messages").scrollTop=$("messages").scrollHeight}
else if(!on&&t)t.remove()}

/* ---- save / load chat ---- */
function saveChat(){try{var out=[];var ms=$("messages").children;
for(var i=0;i<ms.length;i++){if(ms[i].id=="typingBubble")continue;
out.push({u:ms[i].className.indexOf("user")>-1,t:ms[i].querySelector(".bubble").textContent})}
localStorage.setItem(CHAT,JSON.stringify(out.slice(-40)))}catch(e){}}

function loadChat(){var raw=null;try{raw=JSON.parse(localStorage.getItem(CHAT))}catch(e){}
if(raw&&raw.length){for(var i=0;i<raw.length;i++)addMessage(raw[i].u?"You":"JARVIS",raw[i].t,true);
addHistory("Previous conversation restored.")}
else addMessage("JARVIS","Systems online. How may I assist you?",true)}

/* ---- jokes ---- */
var JOKES=["Why did the computer catch a cold? It left its Windows open.",
"I would tell you a UDP joke, but you might not get it.",
"There are 10 types of people: those who understand binary, and those who don't.",
"My AI colleague went to therapy. Too many unresolved dependencies.",
"Why do programmers prefer dark mode? Because light attracts bugs."];

/* ---- built-in commands (zero quota) ---- */
function handleCommand(text){
var l=text.toLowerCase().trim();
if(l.indexOf("what time")>-1||l.indexOf("current time")>-1)
return "The current time is "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})+".";
if(l.indexOf("what is the date")>-1||l.indexOf("today's date")>-1||l=="today")
return "Today is "+new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+".";
if(l=="open google"||l=="go to google"){open("https://www.google.com","_blank");return "Opening Google."}
if(l=="open youtube"||l=="go to youtube"){open("https://www.youtube.com","_blank");return "Opening YouTube."}
if(l=="open gmail"||l=="go to gmail"){open("https://mail.google.com","_blank");return "Opening Gmail."}
if(l=="flip a coin")return Math.random()<.5?"Heads.":"Tails.";
if(l.indexOf("roll a d")==0||l=="roll a dice"){var m=l.match(/d(\d+)/);var sides=m?+m[1]:6;
return "You rolled a "+(Math.floor(Math.random()*sides)+1)+" out of "+sides+"."}
if(l.indexOf("tell me a joke")>-1||l=="joke")return JOKES[Math.floor(Math.random()*JOKES.length)];
var rn=l.match(/random number(?: between)? (\d+)(?: and | to |-)(\d+)/);
if(rn){var a=+rn[1],b=+rn[2];return "Your number is "+(Math.floor(Math.random()*(b-a+1))+a)+"."}
var tm=text.match(/(?:set (?:a )?timer(?: for)?|remind me in)\s+(\d+)\s*(second|sec|minute|min|hour)/i);
if(tm){var num=+tm[1],unit=tm[2].toLowerCase();
var ms=unit.indexOf("sec")==0?num*1000:unit.indexOf("min")==0?num*60000:num*3600000;
timers.push(setTimeout(function(){addMessage("JARVIS","⏰ Your "+num+" "+unit+" timer has finished.");
if(S.voiceOn&&!S.muted)speak("Your timer has finished.")},ms));
return "Timer set for "+num+" "+unit+(num>1?"s":"")+". I'll let you know."}
var sm=text.match(/^(?:search for|search the web for|google)\s+(.+)$/i);
if(sm){open("https://www.google.com/search?q="+encodeURIComponent(sm[1]),"_blank");return "Searching the web for "+sm[1]+"."}
var calc=text.replace(/×/g,"*").replace(/÷/g,"/");
if(l.indexOf("calculate ")==0)calc=text.substring(10);
if(/^[0-9\s+\-*/().%]+$/.test(calc.trim())&&/[0-9]/.test(calc)){
try{var r=Function('"use strict";return('+calc+')')();
if(typeof r=="number"&&isFinite(r))return "The answer is "+r+"."}catch(e){}}
return null}

/* ---- friendly errors ---- */
function friendly(msg){var m=(msg||"").toLowerCase();
if(m.indexOf("quota")>-1||m.indexOf("429")>-1||m.indexOf("resource_exhausted")>-1)
return "I've reached the free usage limit for now. Try switching to Flash Lite in Settings, or wait a minute and ask again.";
if(m.indexOf("api key")>-1||m.indexOf("credential")>-1||m.indexOf("401")>-1||m.indexOf("403")>-1)
return "That API key isn't being accepted. Use the 🔑 API KEY button to enter a new one.";
if(m.indexOf("not found")>-1||m.indexOf("404")>-1)
return "That model isn't available. Please pick a different one in Settings.";
if(m.indexOf("overloaded")>-1||m.indexOf("503")>-1)
return "The AI service is busy right now. Give it a moment and try again.";
if(m.indexOf("failed to fetch")>-1)return "I can't reach the network. Check your connection.";
return "I couldn't complete that request. "+(msg||"")}

/* ---- ask key ---- */
function askKey(){var k=prompt("Enter your Gemini API key:\n\n(Free at aistudio.google.com/apikey)");
if(k&&k.trim()){apiKey=k.trim();localStorage.setItem(KEY,apiKey);return true}return false}

/* ---- send ---- */
function sendMessage(){
var q=$("messageInput").value.trim();if(!q)return;
addMessage("You",q);addHistory(q);$("messageInput").value="";
var cmd=handleCommand(q);
if(cmd!==null){addMessage("JARVIS",cmd);if(S.voiceOn&&!S.muted)speak(cmd);return}
if(!apiKey&&!askKey()){addMessage("JARVIS","I need an API key to think. Use the 🔑 API KEY button in Settings.");return}

setStatus("THINKING");typing(true);$("sendButton").disabled=true;
msgCount++;$("reqCount").textContent=msgCount;

convo.push({role:"user",parts:[{text:q}]});
var cap=S.saver?4:16;
if(convo.length>cap)convo=convo.slice(-cap);
$("memTag").textContent=convo.length;

var body={system_instruction:{parts:[{text:PERSON[S.person]||PERSON.classic}]},
contents:convo,generationConfig:{temperature:.7,maxOutputTokens:S.person=="expert"?1600:800}};
if(S.search)body.tools=[{google_search:{}}];

var url="https://generativelanguage.googleapis.com/v1beta/models/"+S.model+":generateContent?key="+apiKey;

function attempt(tries){
fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
.then(function(res){return res.json().then(function(d){return{ok:res.ok,st:res.status,d:d}})})
.then(function(r){
if(!r.ok){
if((r.st==429||r.st==503)&&tries<2){addHistory("Busy — retrying...");
return setTimeout(function(){attempt(tries+1)},3000)}
throw new Error((r.d&&r.d.error&&r.d.error.message)||("Error "+r.st))}
var reply="";try{var p=r.d.candidates[0].content.parts;
for(var i=0;i<p.length;i++)if(p[i].text)reply+=p[i].text}catch(e){}
reply=reply.trim();if(!reply)throw new Error("Empty response");
var grounded=false;try{grounded=!!r.d.candidates[0].groundingMetadata}catch(e){}
convo.push({role:"model",parts:[{text:reply}]});
$("memTag").textContent=convo.length;
typing(false);addMessage("JARVIS",reply);
addHistory("JARVIS: "+reply.substring(0,50)+(grounded?" [WEB]":""));
setStatus("ONLINE");$("sendButton").disabled=false;
if(S.voiceOn&&!S.muted)speak(reply)})
.catch(function(e){console.error(e);typing(false);
addMessage("JARVIS",friendly(e.message));setStatus("ONLINE");$("sendButton").disabled=false})}
attempt(0)}

$("sendButton").onclick=sendMessage;
$("messageInput").onkeydown=function(e){if(e.key=="Enter")sendMessage()};
document.onkeydown=function(e){if((e.ctrlKey||e.metaKey)&&e.key=="k"){e.preventDefault();$("messageInput").focus()}};

/* ---- speech out ---- */
function speak(text){if(!text||!("speechSynthesis"in window))return;
speechSynthesis.cancel();setStatus("SPEAKING");
var u=new SpeechSynthesisUtterance(text.replace(/[*#`_]/g,""));
u.rate=S.rate;u.pitch=1;
var vs=speechSynthesis.getVoices(),pick=null;
for(var i=0;i<vs.length;i++)if(vs[i].name==S.voiceName){pick=vs[i];break}
if(!pick)for(var j=0;j<vs.length;j++)if(vs[j].lang=="en-GB"){pick=vs[j];break}
if(pick)u.voice=pick;
u.onend=u.onerror=function(){setStatus("ONLINE")};
speechSynthesis.speak(u)}

function loadVoices(){if(!("speechSynthesis"in window))return;
var vs=speechSynthesis.getVoices();if(!vs.length)return;
var sel=$("voiceSelect");sel.innerHTML="";
for(var i=0;i<vs.length;i++){if(vs[i].lang.indexOf("en")!==0)continue;
var o=document.createElement("option");o.value=vs[i].name;
o.textContent=vs[i].name+" ("+vs[i].lang+")";sel.appendChild(o)}
if(!sel.options.length)sel.innerHTML="<option>Default</option>";
if(S.voiceName)sel.value=S.voiceName}
loadVoices();
if("speechSynthesis"in window){speechSynthesis.onvoiceschanged=loadVoices;
setTimeout(loadVoices,400);setTimeout(loadVoices,1500)}

/* ---- speech in ---- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){recog=new SR();recog.continuous=false;recog.interimResults=false;recog.lang="en-US";
$("micSupport").textContent="Microphone ready.";
recog.onstart=function(){listening=true;setStatus("LISTENING");$("micButton").textContent="🎙 LISTENING..."};
recog.onresult=function(e){$("messageInput").value=e.results[0][0].transcript;sendMessage()};
recog.onerror=function(){listening=false;setStatus("ONLINE")};
recog.onend=function(){listening=false;$("micButton").textContent="🎙 START LISTENING";
if($("status").textContent=="LISTENING")setStatus("ONLINE")}}
else{$("micSupport").textContent="Speech recognition not supported.";
$("micButton").disabled=true;$("chatMic").disabled=true}
function mic(){if(!recog)return;if(listening){recog.stop();return}try{recog.start()}catch(e){}}
$("micButton").onclick=mic;$("chatMic").onclick=mic;

/* ---- buttons ---- */
$("voiceToggle").onclick=function(){S.voiceOn=!S.voiceOn;
this.textContent="VOICE: "+(S.voiceOn?"ON":"OFF");if(!S.voiceOn)speechSynthesis.cancel();saveSet()};
$("muteButton").onclick=function(){S.muted=!S.muted;
this.textContent=S.muted?"UNMUTE":"MUTE";if(S.muted)speechSynthesis.cancel();saveSet()};
$("stopBtn").onclick=function(){if("speechSynthesis"in window)speechSynthesis.cancel();setStatus("ONLINE")};
$("saverBtn").onclick=function(){S.saver=!S.saver;
this.textContent="🔋 SAVER: "+(S.saver?"ON":"OFF");addHistory("Saver "+(S.saver?"on":"off"));saveSet()};
$("searchBtn").onclick=function(){S.search=!S.search;
this.textContent="🔍 SEARCH: "+(S.search?"ON":"OFF");addHistory("Search "+(S.search?"on":"off"));saveSet()};
$("keyButton").onclick=function(){if(askKey())addHistory("API key saved.")};
$("modelSelect").onchange=function(){S.model=this.value;
$("modelTag").textContent=this.value.indexOf("pro")>-1?"PRO":this.value.indexOf("lite")>-1?"LITE":"FLASH";
addHistory("Model: "+this.value);saveSet()};
$("personality").onchange=function(){S.person=this.value;addHistory("Personality: "+this.value);saveSet()};
$("voiceSelect").onchange=function(){S.voiceName=this.value;saveSet()};
$("speechRate").oninput=function(){S.rate=parseFloat(this.value);saveSet()};
$("theme").onchange=function(){applyTheme(this.value);S.theme=this.value;saveSet()};
function applyTheme(t){var c={cyan:"#00eaff",blue:"#398cff",purple:"#b06cff",gold:"#ffc23b",red:"#ff5a5a"}[t]||"#00eaff";
document.documentElement.style.setProperty("--cyan",c)}

$("clearButton").onclick=function(){$("messages").innerHTML="";convo=[];msgCount=0;
$("reqCount").textContent="0";$("memTag").textContent="0";
localStorage.removeItem(CHAT);
addMessage("JARVIS","Conversation cleared. Systems ready.");
$("history").innerHTML="<div>› Conversation cleared</div>"};

$("exportBtn").onclick=function(){var out="JARVIS CONVERSATION — "+new Date().toLocaleString()+"\n\n";
var ms=$("messages").children;
for(var i=0;i<ms.length;i++){if(ms[i].id=="typingBubble")continue;
out+=(ms[i].className.indexOf("user")>-1?"YOU: ":"JARVIS: ")+ms[i].querySelector(".bubble").textContent+"\n\n"}
var a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([out],{type:"text/plain"}));
a.download="jarvis-chat.txt";a.click();addHistory("Conversation saved to file.")};

$("resetButton").onclick=function(){
S={model:"gemini-flash-latest",person:"classic",voiceName:"",rate:1,theme:"cyan",saver:true,search:true,voiceOn:true,muted:false};
saveSet();applySettings();speechSynthesis.cancel();setStatus("ONLINE");addHistory("Settings reset.")};

/* ---- apply saved settings ---- */
function applySettings(){
$("modelSelect").value=S.model;$("personality").value=S.person;
$("speechRate").value=S.rate;$("theme").value=S.theme;applyTheme(S.theme);
$("voiceToggle").textContent="VOICE: "+(S.voiceOn?"ON":"OFF");
$("muteButton").textContent=S.muted?"UNMUTE":"MUTE";
$("saverBtn").textContent="🔋 SAVER: "+(S.saver?"ON":"OFF");
$("searchBtn").textContent="🔍 SEARCH: "+(S.search?"ON":"OFF");
$("modelTag").textContent=S.model.indexOf("pro")>-1?"PRO":S.model.indexOf("lite")>-1?"LITE":"FLASH"}

/* ---- install ---- */
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
var dp=null;
addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;$("installBtn").style.display="block"});
$("installBtn").onclick=function(){if(dp){dp.prompt();dp=null;this.style.display="none"}};

/* ---- boot ---- */
applySettings();loadChat();setStatus("ONLINE");
</script>
</body>
</html>
